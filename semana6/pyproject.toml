[project]
name = "operacion-modelos-muiaap-semana6"
version = "0.1.0"
description = "Material reproducible de Streamlit avanzado para servir modelos."
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4,<2.0",
    "pydantic>=2.10,<3.0",
    "scikit-learn>=1.5,<2.0",
    "streamlit>=1.61.1",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.40,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "modules/06-ux-model-consumption/solutions/02-robust-streamlit/src/model_ui",
]

[tool.pytest.ini_options]
pythonpath = [
    "modules/06-ux-model-consumption/solutions/02-robust-streamlit/src",
]
testpaths = [
    "modules/06-ux-model-consumption/solutions/02-robust-streamlit/tests",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
